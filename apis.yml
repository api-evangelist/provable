name: Provable
description: >-
  Provable Markets is a New York and Amsterdam based financial technology firm
  operating Aurora, the first new SEC-registered Alternative Trading System (ATS)
  for securities finance in over a decade. Through Aurora Marketplace and Aurora
  Trade Manager, Provable delivers front-, middle-, and back-office technology for
  the securities lending market: automated trade matching, contract lifecycle
  management (returns, recalls, marks, rate changes), and CCP connectivity via
  NSCC. Its cloud-native platform exposes open APIs — a Connect/gRPC Aurora API,
  FIX specifications, and WebSocket/webhook event streams — and it is a FINRA
  member registered as an SEC ATS with SOC 2 and ISO 27001 certifications.
